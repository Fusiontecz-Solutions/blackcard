# Deploy via SSH to production (File Browser host layout).
#
# Required GitLab CI/CD variables (project Settings → CI/CD → Variables):
#   SSH_PRIVATE_KEY       - private key for SERVER_USER (ed25519/RSA)
#   GITLAB_DEPLOY_TOKEN   - personal access token (glpat-...), masked
# Optional:
#   GITLAB_DEPLOY_USER    - default prafull2613540
#   SERVER_HOST           - default 72.14.186.251
#   SERVER_USER           - default root
#   PM2_APP               - override PM2 process name
#
# Requires self-hosted runner tagged: vps-deploy
#
# Server layout:
#   /var/www/<book>/BE or Backend   backend git checkout
#   /var/www/<book>/Frontend        node wrapper (index.js)
#   /var/www/<book>/Frontend/FE     Vite frontend git checkout

stages:
  - deploy

variables:
  GIT_STRATEGY: none
  SERVER_HOST: "72.14.186.251"
  SERVER_USER: "root"
  GITLAB_DEPLOY_USER: "prafull2613540"
  PM2_APP: "blackcard-frontend"
  GIT_REPO_URL: "https://gitlab.com/finexus-deploy/blackcard-inhouse-fe.git"

deploy_production:
  stage: deploy
  image: debian:bookworm-slim
  resource_group: production-blackcard-fe
  tags:
    - vps-deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    # Shell runner on VPS: no apt-get (gitlab-runner is not root). openssh-client is preinstalled.
    - |
      if [ -z "$SSH_PRIVATE_KEY" ]; then
        echo "ERROR: set SSH_PRIVATE_KEY in GitLab CI/CD Variables."
        exit 1
      fi
    - |
      if [ -z "$GITLAB_DEPLOY_TOKEN" ]; then
        echo "ERROR: set GITLAB_DEPLOY_TOKEN (personal access token glpat-...) in CI/CD Variables."
        exit 1
      fi
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - |
      ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" \
        PM2_APP="$PM2_APP" \
        DEPLOY_PATH="/var/www/blackcard/Frontend/FE" \
        WRAPPER_PATH="/var/www/blackcard/Frontend" \
        DEPLOY_BRANCH="main" \
        GIT_REPO_URL="$GIT_REPO_URL" \
        GITLAB_DEPLOY_USER="$GITLAB_DEPLOY_USER" \
        GITLAB_DEPLOY_TOKEN="$GITLAB_DEPLOY_TOKEN" \
        bash -s << 'REMOTE'
      set -euo pipefail

      echo "==> Frontend deploy: $DEPLOY_PATH (branch $DEPLOY_BRANCH)"
      cd "$DEPLOY_PATH"

      if [ -z "${GITLAB_DEPLOY_TOKEN:-}" ]; then
        echo "ERROR: GITLAB_DEPLOY_TOKEN is not set in GitLab CI/CD Variables."
        exit 1
      fi

      echo "Updating code..."
      REPO_PATH="${GIT_REPO_URL#https://}"
      ENC_USER=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["GITLAB_DEPLOY_USER"], safe=""))')
      ENC_TOKEN=$(python3 -c 'import urllib.parse,os; print(urllib.parse.quote(os.environ["GITLAB_DEPLOY_TOKEN"], safe=""))')
      AUTH_URL="https://${ENC_USER}:${ENC_TOKEN}@${REPO_PATH}"
      git remote set-url origin "$AUTH_URL"
      git fetch origin "$DEPLOY_BRANCH"
      git checkout "$DEPLOY_BRANCH"
      # Discard anything the previous deploy left dirty before moving the branch.
      # `npm ci` rewrites package-lock.json, so a plain `git pull` aborts with
      # "local changes would be overwritten" the moment that file changes
      # upstream. Matches what the backend deploy already does.
      # .env is preserved explicitly: it was tracked until this change, so a
      # plain reset would delete this server's configuration.
      ENV_BACKUP=$(mktemp)
      if [ -f .env ]; then cp .env "$ENV_BACKUP"; fi
      git clean -fd -e '.env' -e '.env.*' -e 'node_modules' -e 'dist'
      git reset --hard "origin/$DEPLOY_BRANCH"
      if [ -s "$ENV_BACKUP" ]; then cp "$ENV_BACKUP" .env; fi
      rm -f "$ENV_BACKUP"
      git remote set-url origin "$GIT_REPO_URL"

      echo "Building frontend (output used by wrapper in $WRAPPER_PATH)..."
      npm ci || npm install
      npm run build

      echo "Restarting Frontend wrapper PM2: $PM2_APP"
      if pm2 describe "$PM2_APP" >/dev/null 2>&1; then
        pm2 restart "$PM2_APP" --update-env
      elif [ -f "$WRAPPER_PATH/ecosystem.config.js" ]; then
        cd "$WRAPPER_PATH"
        pm2 restart ecosystem.config.js --update-env
      elif [ -f "$WRAPPER_PATH/ecosystem.config.cjs" ]; then
        cd "$WRAPPER_PATH"
        pm2 restart ecosystem.config.cjs --update-env
      else
        echo "ERROR: PM2 process '$PM2_APP' not found. Build OK — set PM2_APP (pm2 ls) or add ecosystem.config.js under Frontend/."
        pm2 ls || true
        exit 1
      fi

      echo "Frontend deployment completed."
      REMOTE
